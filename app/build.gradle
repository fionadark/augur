import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
  id 'com.github.johnrengelman.shadow' version '8.1.1'
  id 'java'
  id 'application'
}

jar {
    manifest {
        attributes 'Main-Class': 'augur.Main'
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

dependencies {
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.20.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.20'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.20.0'
    implementation group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'

    // Use JUnit Jupiter for testing.
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.9.1'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.9.1'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter', version: '5.9.1'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.4'
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.9.1'
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'augur.Main'
}

run {
    standardInput = System.in
}