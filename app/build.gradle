import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

plugins {
  id 'com.github.johnrengelman.shadow' version '8.1.1'
  id 'java'
  id 'application'
  id 'jacoco'
}

jar {
    manifest {
        attributes 'Main-Class': 'augur.Main'
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}

jacoco {
    toolVersion = '0.8.13'
}

dependencies {
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.20.0'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-annotations', version: '2.20'
    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.20.0'
    implementation group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'

    // Use JUnit Jupiter for testing.
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: '5.9.1'
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: '5.9.1'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.4'
    testImplementation group: 'org.mockito', name: 'mockito-core', version: '5.19.0'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // report is always generated after tests run

    testLogging {
        events "passed", "failed", "skipped"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

application {
    mainClass = 'augur.Main'
}

run {
    standardInput = System.in
}